<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLaDOS demo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f12;
    --panel: #16181d;
    --line: #232830;
    --muted: #7c8390;
    --user: #4aa3ff;
    --assistant: #79e08a;
    --tool: #d4a437;
    --error: #ef5b5b;
    --system: #7c8390;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: var(--bg); color: #e6e9ef;
    display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
  }
  header { padding: .75rem 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header .status { font-size: .8rem; color: var(--muted); }
  header .status.live { color: var(--assistant); }
  header .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
  header input, header select {
    background: var(--panel); border: 1px solid var(--line); color: inherit;
    padding: .25rem .4rem; border-radius: 4px; font-size: .8rem;
  }
  header button {
    background: var(--user); color: #000; border: none; padding: .25rem .6rem;
    border-radius: 4px; font-size: .8rem; cursor: pointer; font-weight: 600;
  }
  header button.disconnect { background: var(--error); color: #fff; }

  #log { overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: .5rem .75rem; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line);
    white-space: pre-wrap; word-break: break-word; line-height: 1.4;
  }
  .row.user .bubble { background: rgba(74,163,255,.18); border-color: rgba(74,163,255,.4); }
  .row.assistant .bubble { background: rgba(121,224,138,.12); border-color: rgba(121,224,138,.35); }
  .row.tool .bubble { background: rgba(212,164,55,.10); border-color: rgba(212,164,55,.35); font-family: ui-monospace, monospace; font-size: .85rem; color: var(--tool); }
  .row.system { justify-content: center; }
  .row.system .bubble { background: transparent; border: none; color: var(--system); font-size: .75rem; padding: 0; }
  .row.error .bubble { background: rgba(239,91,91,.12); border-color: rgba(239,91,91,.4); color: var(--error); }
  .meta { font-size: .65rem; color: var(--muted); margin-top: .25rem; }

  footer { padding: .75rem 1rem; border-top: 1px solid var(--line); display: grid; grid-template-rows: auto auto; gap: .5rem; }
  .quick { display: flex; gap: .5rem; flex-wrap: wrap; }
  .quick button {
    background: var(--panel); color: inherit; border: 1px solid var(--line);
    padding: .35rem .65rem; border-radius: 16px; font-size: .8rem; cursor: pointer;
  }
  .quick button:hover { border-color: var(--user); }
  .input-row { display: flex; gap: .5rem; }
  .input-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: inherit;
    padding: .55rem .75rem; border-radius: 6px; font-size: .95rem;
  }
  .input-row button {
    background: var(--user); color: #000; border: none; padding: 0 1.25rem;
    border-radius: 6px; font-size: .9rem; cursor: pointer; font-weight: 600;
  }
  .input-row input:disabled, .input-row button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>GLaDOS demo</h1>
  <span id="status" class="status">disconnected</span>
  <div class="right">
    <input id="clientId" value="desk-ui" size="10" title="client_id">
    <input id="roomId" value="desk" size="6" title="room_id">
    <input id="token" value="dev-token-desk" size="14" title="token">
    <button id="connectBtn">connect</button>
  </div>
</header>

<main id="log"></main>

<footer>
  <div class="quick">
    <button data-text="What time is it?">What time is it?</button>
    <button data-text="Hello GLaDOS">Hello GLaDOS</button>
    <button data-text="Tell me a joke">Tell me a joke</button>
  </div>
  <form class="input-row" id="form">
    <input id="input" placeholder="say something…" autocomplete="off" disabled>
    <button id="sendBtn" type="submit" disabled>send</button>
  </form>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let ws = null;
let liveBubbles = new Map();   // session_id → assistant bubble element

function setStatus(text, live=false) {
  const el = $("status");
  el.textContent = text;
  el.classList.toggle("live", live);
}

function setEnabled(connected) {
  $("input").disabled = !connected;
  $("sendBtn").disabled = !connected;
  $("clientId").disabled = connected;
  $("roomId").disabled = connected;
  $("token").disabled = connected;
  const btn = $("connectBtn");
  btn.textContent = connected ? "disconnect" : "connect";
  btn.classList.toggle("disconnect", connected);
}

function row(kind, text, meta) {
  const r = document.createElement("div");
  r.className = "row " + kind;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    b.appendChild(m);
  }
  r.appendChild(b);
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
  return b;
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case "welcome":
      row("system", `session ${msg.session_id}`);
      break;
    case "assistant_delta": {
      let bubble = liveBubbles.get(msg.session_id);
      if (!bubble) {
        bubble = row("assistant", "");
        liveBubbles.set(msg.session_id, bubble);
      }
      bubble.textContent += msg.text;
      log.scrollTop = log.scrollHeight;
      break;
    }
    case "tool_call":
      row("tool", `→ ${msg.server}.${msg.name}(${JSON.stringify(msg.args)})`,
          `call_id ${msg.call_id}`);
      break;
    case "tool_result":
      row("tool",
          msg.ok ? `← ${JSON.stringify(msg.content)}` : `← error: ${msg.error}`,
          `call_id ${msg.call_id}`);
      break;
    case "done":
      liveBubbles.delete(msg.session_id);
      break;
    case "cancelled":
      row("system", `cancelled ${msg.session_id}`);
      liveBubbles.delete(msg.session_id);
      break;
    case "error":
      row("error", `${msg.code}: ${msg.message}`);
      break;
    default:
      row("system", `(unknown) ${JSON.stringify(msg)}`);
  }
}

function connect() {
  const clientId = $("clientId").value.trim();
  const roomId = $("roomId").value.trim();
  const token = $("token").value.trim();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/v1`);
  setStatus("connecting…");

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "hello", client_id: clientId, room_id: roomId, role: "ui", token: token,
    }));
    setStatus(`connected as ${clientId} (${roomId})`, true);
    setEnabled(true);
    $("input").focus();
  };
  ws.onmessage = (ev) => {
    try { handleServerMessage(JSON.parse(ev.data)); }
    catch (e) { row("error", `bad payload: ${ev.data}`); }
  };
  ws.onclose = () => {
    setStatus("disconnected");
    setEnabled(false);
    ws = null;
  };
  ws.onerror = () => row("error", "websocket error");
}

function disconnect() {
  if (ws) ws.close();
}

function sendText(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !text) return;
  row("user", text);
  ws.send(JSON.stringify({ type: "user_text", text }));
}

$("connectBtn").addEventListener("click", () => {
  if (ws) disconnect(); else connect();
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  $("input").value = "";
  sendText(text);
});
document.querySelectorAll(".quick button").forEach((b) => {
  b.addEventListener("click", () => sendText(b.dataset.text));
});
</script>

</body>
</html>
