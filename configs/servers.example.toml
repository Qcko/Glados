# MCP stdio servers GLaDOS spawns + manages.
#
# === Setup ===
# This file is the tracked TEMPLATE. The loader prefers `servers.toml`
# (gitignored) and falls back here with a warning if it's missing.
# Before running GLaDOS, copy this file to `configs/servers.toml` and
# fill in the `<path-to>` / `<your-secrets-dir>` placeholders below for
# your local layout. The real `servers.toml` will never be committed.
#
# Each entry spawns a subprocess on app start (when autostart=true) and
# registers every tool returned by its `tools/list` response into the
# MCPRegistry as `<server.id>.<tool.name>`. Transport is real MCP (line-
# delimited JSON-RPC 2.0); see scripts/toy_stdio_server.py for a worked
# example of the wire shape.
#
# Schema:
#   id              -- server identifier; becomes the `server` prefix on
#                     every tool's qualified name. Real MCP doesn't put
#                     the server name on the wire, so this is the only
#                     place it's defined.
#   command         -- executable to launch.
#   args            -- list of command-line args.
#   env             -- env-var dict layered on top of the parent process env.
#   autostart       -- spawn on app startup. False = present but inert.
#   lazy            -- spawn at startup only to list tools (so the LLM sees
#                     them), then put the child dormant. The first tool
#                     dispatch wakes it; after `idle_timeout_s` of no calls the
#                     reaper sleeps it again (ARCH section 13). Default false keeps the
#                     child resident for the whole session. Use for heavy
#                     servers (Dunnes Selenium/Chrome) that idle most sessions.
#                     Ignored when autostart=false.
#   idle_timeout_s  -- seconds of no dispatch before a lazy server is reaped
#                     back to dormant. Default 300. Ignored unless lazy=true.
#   trusted         -- first-party origin gate for server-shipped memory
#                     (ARCH section 14). When true, GLaDOS reads the server's
#                     `memory://lessons` resource at connect and, IF the blob
#                     clears the LocalGuard hash-approval gate, injects it
#                     (guard-wrapped) into the system prompt. Default false:
#                     the lessons resource is never read. Origin trust is not
#                     content trust -- `trusted = true` only makes the blob
#                     eligible; it still has to match a human-approved
#                     baseline (`localguard memory approve`) or nothing is
#                     injected (fail closed).
#   untrusted       -- server-level UNTRUSTED FLOOR (ARCH section 7). True means every
#                     tool this server exposes returns content from outside the
#                     local trust boundary, so the Organizer wraps every result
#                     in <external> and the system-prompt rule makes it data,
#                     not instructions.
#
#                     Prefer this over repeating `untrusted = true` in every
#                     overlay. The per-tool flag is fail-OPEN: when a server
#                     grows a tool it is treated as TRUSTED until somebody
#                     remembers to list it, and remembering is not a security
#                     control. The floor also covers tools that do not exist
#                     yet. It is a FLOOR, not a default -- an overlay may raise
#                     one tool to untrusted, but can never lower one below it.
#   [server.tool_overlays.<ToolName>] -- per-tool overlay applied after
#                     `tools/list`. GLaDOS-only flags don't ride the wire
#                     (third-party servers don't know about them), so we
#                     carry them here. Fields: untrusted, requires_confirmation,
#                     mutating (side-effecting but un-gated -- lets the
#                     turn-outcome goal-check see an action landed; gated tools
#                     count as mutating automatically), timeout_s (overrides
#                     the 8s dispatch default -- needed for slow Selenium loads).
#
# Crash semantics: a subprocess that dies is auto-restarted with bounded
# attempts within a rolling window (default 3 / 60s, exponential backoff).
# Once the budget is spent the circuit opens and tool calls return a clean
# error rather than respawning forever. See ARCH section 7.

[[server]]
id = "toy_stdio"
command = "python"
args = ["scripts/toy_stdio_server.py"]
autostart = true

# Gated by the v2 permission framework so the demo has a real confirm-prompt
# path to exercise without inventing a side-effecting tool. Rolling dice is
# not actually destructive -- this is scaffolding.
[server.tool_overlays.roll_dice]
requires_confirmation = true


# ---- Dunnes Stores: Selenium-driven grocery shopping ------------------
#
# Unofficial MCP server at <path-to>/DunnesStoresMCP that drives
# dunnesstoresgrocery.com via a persistent Chrome profile. Login is
# always manual (BootstrapLogin opens visible Chrome; the server never
# sees credentials). All tool results are live scrapes -- every tool is
# untrusted. Cart writes + delivery-slot commitment are gated because
# Selenium = real money once the user advances to payment manually.
#
# Substitute the two placeholders below for your local layout, then
# locally run `git update-index --skip-worktree configs/servers.toml`
# to keep your real paths out of future commits.
#
# First-time setup (one-off):
#   1. Ensure the profile dir exists: <your-secrets-dir>/dunnes-edge-profile
#   2. From an MCP client, call BootstrapLogin and complete login in the
#      Edge window that opens. Profile cookies persist; future
#      StartBrowser calls reuse them headlessly until cookies expire.

[[server]]
id = "dunnes"
command = "dotnet"
# Invoke the built assembly directly. `dotnet run` rebuilds on every
# launch (~6s) and clutters stdout with MSBuild banners that can confuse
# the JSON-RPC reader on slow machines. Rebuild manually after pulling:
#   dotnet build <path-to>/DunnesStoresMCP/DunnesStoresMCP/McpServer -c Release
args = [
    "<path-to>/DunnesStoresMCP/DunnesStoresMCP/McpServer/bin/Release/net10.0/win-x64/McpServer.dll",
]
autostart = true
env.DUNNES_EDGE_PROFILE = "<your-secrets-dir>/dunnes-edge-profile"
# Every result is a live scrape of a third-party site, so the judgement is
# whole-server rather than per-tool. This one line replaces the 25 repetitions
# of `untrusted = true` that used to sit in the overlays below, and unlike them
# it also covers any tool a future build of the server adds.
untrusted = true

# NOTE: tool keys here are snake_case -- the .NET MCP SDK auto-converts
# C# PascalCase method names (`AddToCart`) to snake_case (`add_to_cart`)
# on the wire. Confirmed against /healthz on first boot. Overlay keys
# match the `tool.name` returned by `tools/list`, not the C# source.

# --- Browser session ---------------------------------------------------
# Selenium operations need ~30s for SPA page loads; 35s gives headroom.

[server.tool_overlays.start_browser]
timeout_s = 35.0

[server.tool_overlays.bootstrap_login]
# Manual login -- user types credentials in a visible Chrome window. Can
# easily take a minute or three. Gated because (a) the LLM should never
# fire it on its own; (b) the long timeout would otherwise starve the
# room worker if it fires unattended.
requires_confirmation = true
timeout_s = 300.0

[server.tool_overlays.open_login_page]
timeout_s = 35.0

[server.tool_overlays.check_login_status]
timeout_s = 35.0

[server.tool_overlays.stop_browser]
timeout_s = 35.0

# --- Shop & favourites -------------------------------------------------

[server.tool_overlays.search_products]
timeout_s = 35.0

# Cart writes (add_to_cart, set_cart_quantity, remove_from_cart) and the
# delivery-slot commit are intentionally NOT gated by requires_confirmation.
# The hard safety boundary is the manual payment step in the visible Edge
# window -- Dunnes MCP never submits payment, the user reviews the cart and
# pays themselves. Inserting a per-call confirmation modal on top of that
# would break the conversation flow ("add milk" -> "may I add milk?" ->
# "yes" makes no sense as voice UX) without adding real money safety.
# They DO carry mutating = true so the turn-outcome goal-check can tell a
# real cart change from a read/search (without it, a successful add looks
# like a no-op and the turn is wrongly classed `failed`).

[server.tool_overlays.add_to_cart]
mutating = true
timeout_s = 35.0

# The one-shot search+add path the model prefers for "add <name>". Needs the
# same Selenium timeout as a search, and is a cart write (mutating).
[server.tool_overlays.add_to_cart_by_name]
mutating = true
timeout_s = 35.0

# Volume-aware add ("4 litres of milk") -- composes the target across pack
# sizes and writes them to the cart, so it is mutating like the other adds.
# Without the flag a successful compose looks like a no-op to the goal-check
# and the turn is wrongly classed `failed`, which then re-fires the add on
# the escalation loopback (double cart-add).
[server.tool_overlays.add_by_volume]
mutating = true
timeout_s = 35.0

# Added 20-08-2026. This tool had NO overlay at all, which cost two things:
#   1. `mutating` defaulted to false, so the escalation guard could not see it.
#      That guard exists to stop a `failed` turn being re-driven on the
#      specialist and firing the side effect twice -- and this is the single
#      highest-blast-radius write we have, since it adds an ENTIRE RECIPE in one
#      call. Exactly the failure the add_by_volume comment above describes.
#   2. `timeout_s` fell back to the 8 s dispatch default (mcp/registry.py
#      `dispatch(timeout=8.0)`) while every sibling cart tool gets 35 s. It
#      performs N sequential Selenium cart writes in ONE call, so 8 s is not
#      survivable: a 13-item add measured 20-08-2026 timed out on both models.
# Same class as the 04-06-2026 escalation double-fire fix. The tool arrived
# 16-06-2026 as an INBOUND handoff from the DunnesStoresMCP repo, which is how
# it missed the overlay pass -- worth knowing, because the next inbound tool
# will miss it the same way.
#
# TWO KNOWN LIMITS OF THIS FIX, both deliberate, neither closed here:
#   a) `mutating` only protects the SUCCESS path. The guard is
#      `t.ok and t.mutating` (core/turn_outcome.py `_has_successful_mutation`),
#      and a dispatch timeout returns `ok=False` (mcp/registry.py). So a recipe
#      add that times out HALFWAY still classifies `failed` and can still be
#      re-driven on the specialist -- and the Dunnes contract is ADDITIVE
#      (SESSION 16-06-2026), so a re-run DOUBLES the quantities already written.
#      180 s makes that rare; it does not make it impossible. Closing it needs
#      an "attempted mutation" signal, not just a successful one.
#   b) 180 s of an UNGATED, model-invoked call blocks the room worker
#      (core/room_queues.py runs one worker per room), so later utterances in
#      that room queue behind it. `bootstrap_login` below takes the other route
#      -- 300 s but confirmation-gated, explicitly so it cannot starve a room
#      unattended. Barge-in still cancels the in-flight action, which is the
#      only reason this is tolerable.
[server.tool_overlays.add_recipe_ingredients]
mutating = true
timeout_s = 180.0

[server.tool_overlays.view_favorites]
timeout_s = 35.0

# A voice reply is read start to finish -- the listener cannot skim -- so a
# dozen sale items is a dozen items of speech. The server ranks and filters
# (it owns the price history); GLaDOS only slices, which is why these three
# keys name a shape and a count and never a field of Dunnes' schema.
# `flex_to` covers the absurd case: withholding one item to offer it back.
[server.tool_overlays.scan_favorites_for_sales]
timeout_s = 35.0
max_items = 5
flex_to = 7
items_key = "items"

# --- Cart --------------------------------------------------------------

[server.tool_overlays.view_cart]
timeout_s = 35.0

[server.tool_overlays.set_cart_quantity]
mutating = true
timeout_s = 35.0

[server.tool_overlays.remove_from_cart]
mutating = true
timeout_s = 35.0

# Name-resolving cart mutators (the model's preferred path: "set milk to 2",
# "take one off", "remove the bread"). Each resolves a free-text name to a
# cart line and writes it, so all carry mutating = true -- same reason as the
# id-based writers above: a successful change must register as a mutation so
# the turn is classed `done` (not `failed`) and the escalation loopback does
# not re-fire it.
[server.tool_overlays.set_cart_quantity_by_name]
mutating = true
timeout_s = 35.0

[server.tool_overlays.remove_from_cart_by_name]
mutating = true
timeout_s = 35.0

[server.tool_overlays.adjust_cart_quantity_by_name]
mutating = true
timeout_s = 35.0

# --- Checkout (stops at slot selection) --------------------------------

[server.tool_overlays.list_delivery_slots]
timeout_s = 35.0

[server.tool_overlays.set_delivery_slot]
mutating = true
# Last automated step before payment; ungated for the same reason as the
# cart writes -- manual payment is the safety boundary.
timeout_s = 35.0

# --- Local catalog (no network -- cached JSON) --------------------------
# The catalog tools (catalog_search, get_catalog_product, list_catalog,
# catalog_path, get_price_history, get_price_stats) need no overlays at all:
# the data was originally scraped, so it is untrusted -- covered by the server
# floor above -- and with no Selenium the 8s dispatch default is fine.




# ---- calendar-mcp: the household calendar --------------------------------
#
# NOT ENABLED YET (autostart = false). The entry is here so that whoever turns
# it on gets the trust flags right by default rather than by memory -- see
# calendar-mcp's DESIGN.md, "orchestrator contract", and the G1 slice.
#
# Why untrusted, given this is a first-party server we wrote ourselves: origin
# trust is not content trust. The rows it returns are not all ours. Event and
# task text can be authored from a phone through an internet-facing relay that
# the design assumes is breachable, and those rows are tagged `origin=app` in
# the database. A compromised relay can forge in-schema writes, so an event
# title is attacker-influenced text that lands in the model's context the next
# time anyone asks what is on today.
#
# The floor is set at the SERVER level on purpose. calendar-mcp today exposes
# reads only, but its next arc adds authoring tools -- exactly the tools whose
# results carry the most caller-authored text. A per-tool list would leave each
# of those trusted on the day it shipped.
#
# `trusted` stays false: that is the separate gate for injecting the server's
# own memory://lessons into the SYSTEM prompt, and it is not needed here.
#
# Before enabling: run the G1 live verification -- start GLaDOS with this entry
# on, ask for today's agenda, and confirm in the trace that the tool result
# arrived wrapped in <external>.

[[server]]
id = "calendar"
command = "uv"
args = ["run", "--project", "<path-to>/calendar-mcp", "calendar-mcp"]
autostart = false
untrusted = true
trusted = false
# The calendar is a "what's on today" server: cheap to keep resident, and asked
# about often enough that lazy spawning would just add latency.
lazy = false
# Distinctive nouns only. "today"/"tomorrow"/"week" are matched whole-word
# against the entire utterance, so they would pull the calendar into scope on
# "what's the weather today" and a large fraction of other turns -- which
# defeats the point of scoping. Harmless for safety (reads, and wrapped),
# wasteful for the tool budget.
intent_keywords = [
    "calendar", "agenda", "schedule", "event", "events", "appointment",
    "appointments", "meeting", "meetings", "todo", "board",
]
