# MCP stdio servers GLaDOS spawns + manages.
#
# Each entry spawns a subprocess on app start (when autostart=true) and
# registers every tool returned by its `tools/list` response into the
# MCPRegistry as `<server.id>.<tool.name>`.
#
# Schema (v1):
#   id        — server identifier; must match the `server` field on each
#               tool spec the subprocess returns (it does — `toy_stdio`
#               returns tools with server="toy_stdio").
#   command   — executable to launch.
#   args      — list of command-line args.
#   env       — env-var dict layered on top of the parent process env.
#   autostart — spawn on app startup. False = present but inert (manual
#               start later; useful for tools you only need on demand).
#
# Crash semantics for v1: if a subprocess dies, its tools' calls fail
# loud with `RuntimeError("stdio server died")` and the voice loop keeps
# running. Auto-restart is a follow-up (ARCH §7).

[[server]]
id = "toy_stdio"
command = "python"
args = ["scripts/toy_stdio_server.py"]
autostart = true
