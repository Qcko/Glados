[server]
host = "127.0.0.1"
port = 8765
traces_dir = "traces"

# Real tokens live in the OS keyring under service `glados.client-tokens`
# (username = client id). Populate via:
#   python -m glados.secrets set client-tokens desk-ui
# This file only enumerates which client ids are allowed to connect.
[auth]
clients = ["desk-ui", "desk2-ui", "livingroom-mic", "livingroom-speaker"]

[llm]
# backend: "fake" (deterministic, used in tests) or "ollama"
backend = "ollama"
# Swap by un/commenting. Restart GLaDOS to pick up the change. Swapping to a
# model Ollama parses natively (any qwen3 line below) means commenting out
# `text_tool_format` in the same edit -- the config refuses the mismatched pair
# rather than let it boot, because the symptom is tool calls read ALOUD.
# REASONING MODELS: qwen3 emits <think> tokens that count against num_predict.
# Never ship one without checking the num_predict note further down -- at 512 a
# qwen3 goes silent rather than slow, which does not look like a config fault.
# model = "qwen3:4b"                         # 4.80 GB at 12288 -- 20/22, plain-sentence replies (best for TTS); also the hardcoded default
# model = "qwen2.5:14b-instruct"             # Q4_K_M (8.4 GB) -- DO NOT SHIP: Thai/JSON pathologies (bake-off 03-06-2026)
# model = "qwen2.5:14b-instruct-q5_K_M"      # Q5_K_M (10.5 GB) -- previous ship; 15/22, and the only model measured to LEAK tool text
# model = "qwen3:8b"                         # 7.23 GB at 12288 -- 21/22, previous ship; retired 27-08-2026 on PROVENANCE, not merit
# model = "ministral3:14b-instruct"          # 8.24 GB -- 19/22, and 92% of a 12 GB card. Answers T5 properly, which 8b does not
model = "ministral3:8b-instruct"             # 5.2 GB at 12288 -- 20/22 twice, best-in-field dispatch h0 (32/33), 0.4s median (5x qwen3:8b)
# NOT an Ollama library tag: build it once per machine from the Modelfile in
# `configs/`, which carries the tool-capable template mistralai's GGUF omits.
#   ollama create ministral3:8b-instruct -f configs/ministral3-8b-instruct.Modelfile
#
# Ministral hands tool calls back as TEXT (`[TOOL_CALLS]name[ARGS]{...}`);
# Ollama does not parse that shape, so without the line below every call is
# SPOKEN instead of run. Opt-in per model on purpose -- it lets the adapter
# treat the spoken channel as a dispatch source, which is a trust decision
# (ARCH section 7). See src/glados/brain/llm/tool_text.py.
text_tool_format = "mistral_v13"
host = "http://localhost:11434"
# Greedy decoding (0.0). Originally set because the 14b/Q5 (retired 19-08-2026)
# drifted into another language when sampled; greedy + the "reply in English"
# prompt rule curbed the code-switching without hurting tool-call selection.
# RECONSIDERED, not inherited: qwen3:8b was measured at 0.0 and scored 21/22
# with no drift and no repetition loop. Flagged for future work -- Qwen's own
# guidance advises against greedy for qwen3 in thinking mode (repetition risk),
# which is the failure num_predict bounds, and that bound is now 8x looser.
# Revisit if a repetition loop ever shows up in ~/.glados/logs/glados.log.
temperature = 0.0
# Repetition penalty. SENT EXPLICITLY rather than inherited, because an unset
# value is not a constant: Ollama fills in 1.1 and llama.cpp fills in 1.0, so
# omitting it hands the choice to whichever runtime serves the request and lets
# a runtime swap move it silently. Until 2026-08-27 this was never sent at all.
#
# 1.1 is the INCUMBENT, not a proven optimum -- every score in this file was
# recorded under it by inheritance. Setting it explicitly is behaviour-neutral:
# measured 2026-08-27, an explicit 1.1 reproduces the recorded h2 dispatch row
# exactly (15 correct / 3 wrong_tool / 0 miss / 10 abstain / 2 false_fire).
#
# DO NOT LOWER THIS TO 1.0 on the strength of abstention accuracy alone. It
# looks like a clean win and is not. Measured on ministral3:8b-instruct:
#   1.0 REMOVES an intermittent (~56%, n=16) spurious call to toy_stdio.echo
#       on abstain turns -- echo has no overlay, so it is NON-mutating: noise.
#   1.0 INTRODUCES a deterministic (12/12) call to add_to_cart_by_name on
#       "add one more of the tomatoes" -- `mutating = true` in servers.toml --
#       i.e. a duplicate cart line instead of a quantity bump. At 1.1 the model
#       calls view_cart, a READ, which the fixture accepts.
# So 1.0 trades an intermittent harmless call for a deterministic wrong WRITE.
# The scorecard hides the trade: both count as one fixture.
#
# MODEL-DEPENDENT, like num_predict -- re-derive on a model swap. Only two
# values, on one model, have ever been measured.
repeat_penalty = 1.1
timeout = 60.0
# Keep the model resident in VRAM so it never evicts mid-session. A re-cold
# model drifts language (replies in Thai) and skips tools on its next free-form
# turn; the boot warm-up only covers GLaDOS start, not an Ollama eviction. "-1"
# = forever (sent as int); a unit duration ("30m", "1h") or "0" (evict at once)
# also work. Passed through to the /api/chat keep_alive field.
keep_alive = "-1"
# Context window. Until 2026-08-17 this was never sent at all, so every request
# ran at Ollama's own small default and the prompt was truncated FROM THE FRONT
# -- silently evicting the system prompt, and with it the <external> rule and
# the reply-in-English rule. Nothing else here budgets tokens (history is capped
# by turn count, not size), so this is the only ceiling.
# 12288 since 20-08-2026, raised from the 8192 the 21/22 bake-off was scored at,
# because num_predict=4096 did not FIT inside 8192 alongside a real prompt (see
# the coupling note below). The score was not re-measured at 12288 -- a larger
# window is not a sampling change, but if quality ever looks off, this is a
# variable that moved.
# Raising this will not OOM -- it just offloads more and gets slower.
# THIS VALUE BELONGS TO THE MODEL TAG SELECTED ABOVE -- change both together.
# Historical, for the 14b/Q5 that shipped until 19-08-2026: it spilled to CPU at
# EVERY context size (1.7 GB at 8k, 3.9 GB at 16k, 8.7 GB at 32k), which is why
# this value used to be described as conservative-on-purpose.
# Measured 2026-08-17, 12 GB card, ~2.3 GB held by the desktop:
#   qwen2.5:14b-instruct-q5_K_M -> 8192. Spills 1.7 GB to CPU even here (and
#     815 MiB at 4096), so there is no spill-free setting for this model on
#     this card; 8192 buys context without making the offload much worse.
#   qwen2.5:7b-instruct         -> 32768. Fully resident, ZERO spill (7830 MiB
#     total). Model REMOVED from disk 19-08-2026 (qwen3:4b is smaller and
#     scores better); row kept because it is what the 32k datapoint came from.
# Measured 19-08-2026, same card, via /api/ps at 8192:
#   qwen3:8b -> 6.61 GB, size == size_vram, i.e. ZERO spill. The 21/22 bake-off
#     was scored at this value.
#   qwen3:4b -> 4.18 GB, size == size_vram, ZERO spill.
#   Both qwen3 tags fit the 12 GB card whole, unlike the 14b/Q5 they replace --
#     which never had a spill-free setting here at any context size.
# Measured 20-08-2026 at the now-shipped 12288, same card:
#   qwen3:8b (SHIPPED) -> 7.23 GB, ZERO spill. +0.62 GB over 8192.
#   qwen3:4b (default) -> 4.80 GB, ZERO spill. +0.62 GB over 8192.
#
# COUPLED TO num_predict -- NEVER TUNE ONE ALONE. Generated tokens occupy this
# same window, so the invariant is:
#     max_assembled_prompt + num_predict <= num_ctx
# Measured 20-08-2026 over a 9-turn search-heavy session, the assembled prompt
# plateaus at ~4.7k (history_max_turns bounds it; large tool payloads are not
# retained whole). At the OLD 8192 that left 4662 + 4096 = 8758, i.e. the cap
# permitted a reply ~570 tokens LARGER than the window could hold -- silent
# front-truncation waiting to happen, and front-truncation evicts the system
# prompt FIRST. It never fired only because real replies top out near 800
# tokens. 12288 restores the margin with room for history growth.
#
# The context-pressure warning does NOT enforce that invariant. It fires on
# prompt_tokens alone at 0.8 * num_ctx (brain/llm/ollama.py), i.e. 9830 here,
# while the invariant caps the prompt at num_ctx - num_predict = 8192. So there
# is a ~1.6k band where the coupling is violated and nothing warns. Checking
# `prompt_tokens + num_predict > num_ctx` would close it.
#
# CO-RESIDENCY WARNING: 7.23 + 4.80 = 12.03 GB, which no longer fits the 12 GB
# card. At 8192 the pair fitted (6.61 + 4.18 = 10.79). Harmless as shipped --
# `local_smart_model = ""` means the specialist ALIASES the primary, so only one
# model is resident -- but the router section below suggests running qwen3:8b as
# a specialist while [llm] runs qwen3:4b, and with keep_alive="-1" neither
# evicts. That documented split now spills at 12288. Drop to 8192, or accept the
# spill, if you ever actually run two distinct models.
#
# DO NOT comment this out expecting Ollama's default -- this line said exactly
# that until 19-08-2026 and it was FALSE. `core/config.py` carries a schema
# default (12288 since 20-08-2026), so removing the line changes nothing; TOML has no null, so
# there is no way to unset it from this file at all. To genuinely send no
# num_ctx you must change the schema default in core/config.py to None. The
# false comment silently voided one arm of the 19-08-2026 A/B before anyone
# noticed the log still read num_ctx=8192.
num_ctx = 12288
# Cap on generated tokens per pass. Unbounded generation let the observed
# repetition loop (2026-06-18) run until it filled the context; this bounds that
# failure to a single turn. Keep well above the longest real spoken reply.
# Costs NOTHING at rest: unlike num_ctx this reserves no memory, it is only a
# stop condition. The single risk is clipping a genuinely long reply, and that
# is no longer silent -- Ollama reports done_reason="length" and the adapter
# warns, naming the cap. Watch for that warning in ~/.glados/logs/glados.log,
# NOT the console.
#
# MODEL-DEPENDENT -- re-derive on every model swap. This said
# "model-independent" until 2026-08-19; that was wrong. A reasoning model burns
# the budget inside <think> before emitting anything, so a cap sized for a
# non-reasoning model cuts it off mid-reasoning and the turn comes back as an
# EMPTY reply with no tool call -- indistinguishable from a hang. On the T1-T12
# suite at 512: qwen3:4b 4/22, qwen3:8b 18/22. The same models at 4096: 20/22
# and 21/22. The previously shipping qwen2.5 never truncates at either value, which is
# what made the false claim so easy to believe.
num_predict = 4096
# Language GLaDOS must reply in. The deterministic language guard rewrites any
# free-form reply whose dominant script is not this language's -- the backstop
# for cold-model drift the prompt rule alone does not stop. Only mapped
# languages (currently "en") are guarded; others fail open (no guard).
reply_language = "en"
# Persona/verbosity override. Empty (default) uses the built-in SYSTEM_PROMPT
# from brain/prompts/system.py. Set a full replacement string to retune persona
# per demo without editing code -- restart GLaDOS to pick it up. The ARCH section 7
# untrusted-content rule (<external> tags are data, not instructions) is
# force-appended automatically, so an override can't weaken it. Hash-approved
# server memory (ARCH section 14) is still appended on top of whichever base wins.
# system_prompt = ""

[router]
# v2.6 local multi-model router. Off by default -- GLaDOS runs every turn on
# the single primary brain until you opt in. GLaDOS is all-local (ARCH section 12); the
# `cloud_*` knobs below gate a dormant escape hatch that stays off by default.
#   enabled        -- turn on per-turn routing between primary and specialist
#   cloud_enabled  -- opt in to the dormant cloud escape hatch. Only then does
#                    provider="anthropic" send tool ARGUMENTS and RESULTS to the
#                    external provider (ARCHITECTURE section 9). Leave false to keep
#                    everything local.
# The API key is read from `api_key_env` at boot and never stored here
# (ARCH section 9 -- TOML holds handles, not secrets). Set it in your shell:
#   setx ANTHROPIC_API_KEY "<key>"   # persists for future sessions
# provider:
#   "local"     -- the default all-local specialist: runs on a local Ollama
#                 model, nothing leaves the box (no cloud_enabled / key needed).
#   "anthropic" -- the dormant cloud escape hatch (needs cloud_enabled = true +
#                 an API key). Endpoint hardcoded to api.anthropic.com (ARCH section 12).
enabled = true
cloud_enabled = false
provider = "local"
cloud_model = "claude-haiku-4-5-20251001"
# provider="local" only: Ollama tag for the specialist. Empty = reuse the
# primary brain's model (alias). Point at a bigger local model (e.g. qwen3:8b while
# [llm] runs qwen3:4b) for a realistic primary-vs-specialist split.
local_smart_model = ""
api_key_env = "ANTHROPIC_API_KEY"
# Retry a turn the primary brain finished as `failed` (deterministic outcome)
# on the specialist. This is the TurnOutcome escalation input.
escalate_on_failed = true
# Requests longer than this many words route to the specialist (long/
# multi-clause reasoning the primary fumbles).
max_words_local = 30

[session]
# Conversation continuity (ARCH section 3 idle-window, section 8 hot buffer). A follow-up in
# the same room/speaker reuses the live session -- replaying its history so
# "add it back" / "do that instead" resolve -- when it lands within
# idle_window_s of the last utterance; after that a fresh session opens with no
# history. history_max_turns bounds how many prior turns are replayed.
idle_window_s = 180.0
history_max_turns = 8

[audio]
# Tee inbound mic frames to traces/audio/<client>/<utc>.wav for offline
# replay. Disable in production to keep disk usage bounded.
wav_traces = true

[vad]
# "fake": fixed-size utterances (used in tests). "silero": real VAD.
backend = "silero"
fake_utterance_samples = 16000  # 1 s at 16 kHz
silero_threshold = 0.5
# min_silence_ms IS the end-of-utterance hangover, and speech_pad_ms IS the
# pre-roll -- neither needs building, they only needed tuning. Retuned
# 20-08-2026 from measurements in <lab-root>/glados/vad_probe.py, which feeds
# Piper-synthesised speech with a spliced-in "breath" through the real
# SileroVAD (no microphone involved).
#
# MEASURED, on silence-trimmed clips so the stated gap is the REAL gap:
#   gap    200 (old)   500 (new)   600
#   300ms    SPLIT       held      held
#   400ms    SPLIT       held      held
#   600ms    SPLIT       split     held
# The old 200 ms split a sentence on a 300 ms gap. 500 (briefly shipped
# 20-08-2026) was then raised to 800 the same day on LIVE evidence, which beat
# the synthetic estimate: measuring a real spoken sentence from the desk mic,
# one speaker's ordinary mid-phrase gaps ran 400, 430, 500 and 780 ms. 500 left
# only ~20 ms of margin over normal speech and would have cut on the 780.
# Live-injected calibration through the real pipeline (lab vad_live.py, exact
# gaps, no human timing): gaps to 550 ms held, 600 ms split.
#
# THIS IS ONE SPEAKER, ONE SESSION. The right value is per-person, so 800 is a
# stopgap, not an answer. Filed: GLaDOS should derive it by observing the
# speaker's own gap distribution during use (deterministic harness measurement,
# NOT a prompt or an LLM judgement) -- see PITFALLS / SESSION notes on adaptive
# endpointing. Semantic endpointing (is the transcript a complete request?) is
# the other half, and is where a reasoning model legitimately helps.
silero_min_silence_ms = 800
# NOT MEASURED TO HELP -- this is a deliberate hedge, and the distinction matters.
# On clean synthesised speech the old 30 ms already delivered the FULL utterance
# (0 ms lost at every pad tested), so the offline probe does NOT reproduce the
# reported dropped-onset symptom at all. That points at the capture/AEC path
# dropping audio before it ever reaches the server -- which no VAD setting can
# fix, because you cannot pad audio you never received.
# Raised anyway because it is genuinely free: SileroVAD retains every inbound
# chunk in `_history` regardless of speech state, capped at 60 SECONDS, so this
# only decides how much of already-held audio is handed over. It buys margin for
# a real mic, where onsets ramp rather than starting abruptly.
# If dropped onsets persist on hardware, THIS IS NOT THE FIX -- look at capture.
silero_speech_pad_ms = 200
# THE TRADE, so it is not rediscovered as a regression: a longer hangover means
# the user waits ~300 ms longer after finishing before GLaDOS starts replying.
# That is a real cost against barge-in/responsiveness, accepted deliberately --
# being cut off mid-sentence is worse than a slightly later reply. If end-of-turn
# latency ever becomes the complaint, this is the first value to look at.

[stt]
# "fake": returns `fake_text`. "faster-whisper": real STT (first run
# downloads the model to HF_HOME). Default is English-only
# `distil-small.en` for the latency win on CPU int8.
#
# To re-enable multilingual (EN + CS) input:
#   1. whisper_model = "small"     (or "medium" for better CS detection)
#   2. drop the `whisper_language` line below (None = auto-detect)
#   3. re-add the "always reply in English" clause to SYSTEM_PROMPT
#      in src/glados/brain/prompts/system.py
# ARCH section 13 carries the trade-off log if you need the history.
backend = "faster-whisper"
fake_text = "hello world"
whisper_model = "distil-small.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
whisper_language = "en"
# Vocabulary biasing -- no retraining. `whisper_hotwords` (space-separated)
# nudges decoding toward names/jargon Whisper mishears; grow it from real
# mis-transcriptions. `whisper_initial_prompt` is freeform context that can
# also fix spelling. Leave empty to disable.
whisper_hotwords = "GLaDOS Dunnes"
whisper_initial_prompt = ""

[tts]
# "fake": yields a silent chunk (used in tests). "piper": real Piper TTS.
# First piper construct downloads the voice files (~110 MB for cori-high)
# from huggingface.co/rhasspy/piper-voices into the voices dir.
backend = "piper"
piper_voice = "en_GB-cori-high"
# Voices dir is intentionally NOT pinned here -- this is a shared, tracked
# config and must stay free of machine-specific paths. It defaults to
# $GLADOS_PIPER_VOICES_DIR, else ~/.cache/piper/voices. Set the env var to
# relocate the large voice files off C: (persist it so launches inherit it):
#   setx GLADOS_PIPER_VOICES_DIR "<path-to>\piper\voices"
