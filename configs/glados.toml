[server]
host = "127.0.0.1"
port = 8765
traces_dir = "traces"

# Real tokens live in the OS keyring under service `glados.client-tokens`
# (username = client id). Populate via:
#   python -m glados.secrets set client-tokens desk-ui
# This file only enumerates which client ids are allowed to connect.
[auth]
clients = ["desk-ui", "desk2-ui", "livingroom-mic", "livingroom-speaker"]

[llm]
# backend: "fake" (deterministic, used in tests) or "ollama"
backend = "ollama"
# Swap by un/commenting. Restart GLaDOS to pick up the change.
# model = "qwen2.5:7b-instruct"            # baseline (4.7 GB) -- fallback; beats Q4 14b (bake-off 2026-06-03)
# model = "qwen2.5:14b-instruct"             # Q4_K_M (8.4 GB) -- DO NOT SHIP: Thai/JSON pathologies (bake-off 2026-06-03)
model = "qwen2.5:14b-instruct-q5_K_M"      # Q5_K_M (10.5 GB) -- bake-off winner 2026-06-03 (15/22)
host = "http://localhost:11434"
# Greedy decoding (0.0): the 14b/Q5 local model drifts into another language
# when allowed to sample; greedy + the "reply in English" prompt rule curbs the
# code-switching without hurting tool-call selection.
temperature = 0.0
timeout = 60.0
# Keep the model resident in VRAM so it never evicts mid-session. A re-cold
# model drifts language (replies in Thai) and skips tools on its next free-form
# turn; the boot warm-up only covers GLaDOS start, not an Ollama eviction. "-1"
# = forever (sent as int); a unit duration ("30m", "1h") or "0" (evict at once)
# also work. Passed through to the /api/chat keep_alive field.
keep_alive = "-1"
# Context window. Until 2026-08-17 this was never sent at all, so every request
# ran at Ollama's own small default and the prompt was truncated FROM THE FRONT
# -- silently evicting the system prompt, and with it the <external> rule and
# the reply-in-English rule. Nothing else here budgets tokens (history is capped
# by turn count, not size), so this is the only ceiling.
# 8192 is conservative on purpose, NOT the model maximum: measured 2026-08-17 on
# a 12 GB card, the 14b/Q5 model spills to CPU at EVERY context size (1.7 GB at
# 8k, 3.9 GB at 16k, 8.7 GB at 32k) and each spilled layer costs decode speed.
# Raising this will not OOM -- it just offloads more and gets slower.
# THIS VALUE BELONGS TO THE MODEL TAG SELECTED ABOVE -- change both together.
# Measured 2026-08-17, 12 GB card, ~2.3 GB held by the desktop:
#   qwen2.5:14b-instruct-q5_K_M -> 8192. Spills 1.7 GB to CPU even here (and
#     815 MiB at 4096), so there is no spill-free setting for this model on
#     this card; 8192 buys context without making the offload much worse.
#   qwen2.5:7b-instruct         -> 32768. Fully resident, ZERO spill (7830 MiB
#     total), and decode is flat across 8k/16k/32k -- the signature of nothing
#     being offloaded. On an 8 GB production card use 16384 (6006 MiB) instead;
#     32k leaves no room for the desktop.
# Comment out to fall back to Ollama's default.
num_ctx = 8192
# Cap on generated tokens per pass. Unbounded generation let the observed
# repetition loop (2026-06-18) run until it filled the context; this bounds that
# failure to a single turn. Keep well above the longest real spoken reply.
# Costs NOTHING at rest: unlike num_ctx this reserves no memory, it is only a
# stop condition. The single risk is clipping a genuinely long reply, and that
# is no longer silent -- Ollama reports done_reason="length" and the adapter
# warns, naming the cap. Model-independent; unchanged across model swaps.
num_predict = 512
# Language GLaDOS must reply in. The deterministic language guard rewrites any
# free-form reply whose dominant script is not this language's -- the backstop
# for cold-model drift the prompt rule alone does not stop. Only mapped
# languages (currently "en") are guarded; others fail open (no guard).
reply_language = "en"
# Persona/verbosity override. Empty (default) uses the built-in SYSTEM_PROMPT
# from brain/prompts/system.py. Set a full replacement string to retune persona
# per demo without editing code -- restart GLaDOS to pick it up. The ARCH section 7
# untrusted-content rule (<external> tags are data, not instructions) is
# force-appended automatically, so an override can't weaken it. Hash-approved
# server memory (ARCH section 14) is still appended on top of whichever base wins.
# system_prompt = ""

[router]
# v2.6 local multi-model router. Off by default -- GLaDOS runs every turn on
# the single primary brain until you opt in. GLaDOS is all-local (ARCH section 12); the
# `cloud_*` knobs below gate a dormant escape hatch that stays off by default.
#   enabled        -- turn on per-turn routing between primary and specialist
#   cloud_enabled  -- opt in to the dormant cloud escape hatch. Only then does
#                    provider="anthropic" send tool ARGUMENTS and RESULTS to the
#                    external provider (ARCHITECTURE section 9). Leave false to keep
#                    everything local.
# The API key is read from `api_key_env` at boot and never stored here
# (ARCH section 9 -- TOML holds handles, not secrets). Set it in your shell:
#   setx ANTHROPIC_API_KEY "<key>"   # persists for future sessions
# provider:
#   "local"     -- the default all-local specialist: runs on a local Ollama
#                 model, nothing leaves the box (no cloud_enabled / key needed).
#   "anthropic" -- the dormant cloud escape hatch (needs cloud_enabled = true +
#                 an API key). Endpoint hardcoded to api.anthropic.com (ARCH section 12).
enabled = true
cloud_enabled = false
provider = "local"
cloud_model = "claude-haiku-4-5-20251001"
# provider="local" only: Ollama tag for the specialist. Empty = reuse the
# primary brain's model (alias). Point at a bigger local model (e.g. a 14b while
# [llm] runs a 7b) for a realistic primary-vs-specialist split.
local_smart_model = ""
api_key_env = "ANTHROPIC_API_KEY"
# Retry a turn the primary brain finished as `failed` (deterministic outcome)
# on the specialist. This is the TurnOutcome escalation input.
escalate_on_failed = true
# Requests longer than this many words route to the specialist (long/
# multi-clause reasoning the primary fumbles).
max_words_local = 30

[session]
# Conversation continuity (ARCH section 3 idle-window, section 8 hot buffer). A follow-up in
# the same room/speaker reuses the live session -- replaying its history so
# "add it back" / "do that instead" resolve -- when it lands within
# idle_window_s of the last utterance; after that a fresh session opens with no
# history. history_max_turns bounds how many prior turns are replayed.
idle_window_s = 180.0
history_max_turns = 8

[audio]
# Tee inbound mic frames to traces/audio/<client>/<utc>.wav for offline
# replay. Disable in production to keep disk usage bounded.
wav_traces = true

[vad]
# "fake": fixed-size utterances (used in tests). "silero": real VAD.
backend = "silero"
fake_utterance_samples = 16000  # 1 s at 16 kHz
silero_threshold = 0.5
silero_min_silence_ms = 200
silero_speech_pad_ms = 30

[stt]
# "fake": returns `fake_text`. "faster-whisper": real STT (first run
# downloads the model to HF_HOME). Default is English-only
# `distil-small.en` for the latency win on CPU int8.
#
# To re-enable multilingual (EN + CS) input:
#   1. whisper_model = "small"     (or "medium" for better CS detection)
#   2. drop the `whisper_language` line below (None = auto-detect)
#   3. re-add the "always reply in English" clause to SYSTEM_PROMPT
#      in src/glados/brain/prompts/system.py
# ARCH section 13 carries the trade-off log if you need the history.
backend = "faster-whisper"
fake_text = "hello world"
whisper_model = "distil-small.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
whisper_language = "en"
# Vocabulary biasing -- no retraining. `whisper_hotwords` (space-separated)
# nudges decoding toward names/jargon Whisper mishears; grow it from real
# mis-transcriptions. `whisper_initial_prompt` is freeform context that can
# also fix spelling. Leave empty to disable.
whisper_hotwords = "GLaDOS Dunnes"
whisper_initial_prompt = ""

[tts]
# "fake": yields a silent chunk (used in tests). "piper": real Piper TTS.
# First piper construct downloads the voice files (~110 MB for cori-high)
# from huggingface.co/rhasspy/piper-voices into the voices dir.
backend = "piper"
piper_voice = "en_GB-cori-high"
# Voices dir is intentionally NOT pinned here -- this is a shared, tracked
# config and must stay free of machine-specific paths. It defaults to
# $GLADOS_PIPER_VOICES_DIR, else ~/.cache/piper/voices. Set the env var to
# relocate the large voice files off C: (persist it so launches inherit it):
#   setx GLADOS_PIPER_VOICES_DIR "<path-to>\piper\voices"
