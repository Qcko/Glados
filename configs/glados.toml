[server]
host = "127.0.0.1"
port = 8765
traces_dir = "traces"

# v0 only: tokens live in the config so the server boots without a keyring.
# Real secret storage (OS keyring) lands in v1+.
[auth.tokens]
desk-ui = "dev-token-desk"
desk2-ui = "dev-token-desk2"

[llm]
# backend: "fake" (deterministic, used in tests) or "ollama"
backend = "ollama"
model = "qwen2.5:7b-instruct"
host = "http://localhost:11434"
temperature = 0.2
timeout = 60.0

[audio]
# Tee inbound mic frames to traces/audio/<client>/<utc>.wav for offline
# replay. Disable in production to keep disk usage bounded.
wav_traces = true

[vad]
# "fake": fixed-size utterances (used in tests). "silero": real VAD.
backend = "silero"
fake_utterance_samples = 16000  # 1 s at 16 kHz
silero_threshold = 0.5
silero_min_silence_ms = 200
silero_speech_pad_ms = 30

[stt]
# "fake": returns `fake_text`. "faster-whisper": real STT (first run
# downloads the model to HF_HOME ~ E:\hf). Default `small` is
# multilingual — both English and Czech inputs work; the LLM is
# instructed (in SYSTEM_PROMPT) to always reply in English. Pin
# `whisper_language` to a code like "en" only to force a single
# language; leave unset for auto-detect.
backend = "faster-whisper"
fake_text = "hello world"
whisper_model = "small"
whisper_device = "cpu"
whisper_compute_type = "int8"

[tts]
# "fake": yields a silent chunk (used in tests). "piper": real Piper TTS.
# First piper construct downloads the voice files (~110 MB for cori-high)
# from huggingface.co/rhasspy/piper-voices into piper_voices_dir.
backend = "piper"
piper_voice = "en_GB-cori-high"
piper_voices_dir = "E:\\dev\\piper\\voices"
