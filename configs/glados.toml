[server]
host = "127.0.0.1"
port = 8765
traces_dir = "traces"

# Real tokens live in the OS keyring under service `glados.client-tokens`
# (username = client id). Populate via:
#   python -m glados.secrets set client-tokens desk-ui
# This file only enumerates which client ids are allowed to connect.
[auth]
clients = ["desk-ui", "desk2-ui"]

[llm]
# backend: "fake" (deterministic, used in tests) or "ollama"
backend = "ollama"
# Swap by un/commenting. Restart GLaDOS to pick up the change.
# model = "qwen2.5:7b-instruct"            # baseline (4.7 GB) — fallback; beats Q4 14b (bake-off 2026-06-03)
# model = "qwen2.5:14b-instruct"             # Q4_K_M (8.4 GB) — DO NOT SHIP: Thai/JSON pathologies (bake-off 2026-06-03)
model = "qwen2.5:14b-instruct-q5_K_M"      # Q5_K_M (10.5 GB) — bake-off winner 2026-06-03 (15/22)
host = "http://localhost:11434"
temperature = 0.2
timeout = 60.0

[router]
# v2.6 hybrid local/cloud router. Off by default — GLaDOS stays a pure local
# assistant until you opt in. Two switches, both required for the cloud path:
#   enabled        — turn on per-turn routing (local-only rules still apply)
#   cloud_enabled  — the explicit privacy opt-in. On the cloud path, tool
#                    ARGUMENTS and RESULTS cross to the provider, not just the
#                    transcript (ARCHITECTURE §9). Leave false to keep all data
#                    local even while routing logic runs.
# The API key is read from `api_key_env` at boot and never stored here
# (ARCH §9 — TOML holds handles, not secrets). Set it in your shell:
#   setx ANTHROPIC_API_KEY "<key>"   # persists for future sessions
# provider:
#   "anthropic" — real cloud brain (needs cloud_enabled = true + an API key).
#   "local"     — loopback: the smart path runs on a local Ollama model too.
#                 Nothing leaves the box, so cloud_enabled / the API key are
#                 NOT required. Use this to see the router, escalation, and the
#                 violet "cloud" bubble work end-to-end before picking a cloud
#                 provider. To try it: enabled = true, provider = "local".
enabled = true
cloud_enabled = false
provider = "local"
cloud_model = "claude-haiku-4-5-20251001"
# provider="local" only: Ollama tag for the smart path. Empty = reuse the
# local brain's model (true loopback). Point at a bigger local model (e.g. the
# 14b while [llm] runs a 7b) for a realistic fast-vs-smart split.
local_smart_model = ""
api_key_env = "ANTHROPIC_API_KEY"
# Retry a turn the local brain finished as `failed` (deterministic outcome)
# on the cloud brain. This is the TurnOutcome escalation input.
escalate_on_failed = true
# Requests longer than this many words route to cloud (long/multi-clause
# reasoning the local 14b fumbles).
max_words_local = 30

[audio]
# Tee inbound mic frames to traces/audio/<client>/<utc>.wav for offline
# replay. Disable in production to keep disk usage bounded.
wav_traces = true

[vad]
# "fake": fixed-size utterances (used in tests). "silero": real VAD.
backend = "silero"
fake_utterance_samples = 16000  # 1 s at 16 kHz
silero_threshold = 0.5
silero_min_silence_ms = 200
silero_speech_pad_ms = 30

[stt]
# "fake": returns `fake_text`. "faster-whisper": real STT (first run
# downloads the model to HF_HOME). Default is English-only
# `distil-small.en` for the latency win on CPU int8.
#
# To re-enable multilingual (EN + CS) input:
#   1. whisper_model = "small"     (or "medium" for better CS detection)
#   2. drop the `whisper_language` line below (None = auto-detect)
#   3. re-add the "always reply in English" clause to SYSTEM_PROMPT
#      in src/glados/brain/prompts/system.py
# ARCH §13 carries the trade-off log if you need the history.
backend = "faster-whisper"
fake_text = "hello world"
whisper_model = "distil-small.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
whisper_language = "en"

[tts]
# "fake": yields a silent chunk (used in tests). "piper": real Piper TTS.
# First piper construct downloads the voice files (~110 MB for cori-high)
# from huggingface.co/rhasspy/piper-voices into piper_voices_dir.
backend = "piper"
piper_voice = "en_GB-cori-high"
piper_voices_dir = "E:\\dev\\piper\\voices"
