# Optional per-room intercom policy (DESIGN-cross-room-delivery.md, slice 2).
# Receiver-side: each row says what that room will accept being spoken INTO
# it. A room with no row here accepts an announcement from any other room at
# any hour, with the veto gap on -- the behaviour every install had before
# this table existed. Times are server local time.
#
# `announce_veto_pause` is the room's say over an announcement already cleared
# to arrive: on (the default) it hears the attribution, then a gap, and can
# end the message with the ordinary voice "stop". Off, the announcement is one
# uninterrupted utterance. Turning it off gives up a veto, never a gate -- the
# sending room's confirmation is untouched either way.
#
# [[rooms]]
# room_id = "livingroom"
# announce_sources = ["desk"]                    # omit for "any room"; [] for none
# quiet_hours = { start = "22:00", end = "07:00" }
# announce_veto_pause = true                     # default; false for one utterance
