[project]
name = "glados"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Qcko", email = "komec@centrum.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.46.0",
    "websockets>=16.0",
    "numpy>=2.0",
    "silero-vad>=5.1",
    "faster-whisper>=1.2.0",
    "piper-tts>=1.4.2",
]

[project.scripts]
glados = "glados:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
