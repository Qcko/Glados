# Room-supervisor config. Copy to `client_room/config.room.toml` (gitignored)
# and fill in for the local device. Run with `python -m client_room.room` to
# capture audio AND play replies from one process (the set-and-forget room
# device). For a capture-only or play-only device, use the flat single-role
# `config.toml` with `python -m client_room.mic` / `.speaker` instead.
#
# A device running both roles needs TWO server identities: a client_id binds to
# exactly one (room, role), so the mic and speaker each get their own client_id
# (same room_id) and their own token. Both must be listed in the server's
# `configs/glados.toml` [auth].clients and bound in `configs/rooms.toml` — one
# row role = "mic", one row role = "speaker", both with this room_id.
#
# Resilience: each role self-reconnects on transport blips. If one role hits a
# terminal handshake error (bad token / wrong binding) the supervisor logs it
# loudly and keeps the other role running (degraded, not dark). For reboot/
# both-dead survival, run this under a systemd unit with Restart=on-failure.

server_url = "ws://127.0.0.1:8765"
room_id = "bedroom"

# TLS: when the server runs with a cert (scripts/gen-tls-cert.sh), use a wss://
# URL and pin the server's self-signed cert here. tls_ca is the path to the
# cert.pem copied from the server; the client then trusts ONLY that cert. Omit
# both (ws:// + no tls_ca) for a cleartext-LAN setup.
#   server_url = "wss://192.168.50.x:8765"
# tls_ca = "<your-secrets-dir>/glados-server-cert.pem"

[mic]
client_id = "bedroom-mic"
# Token precedence keyring → env → file (first present wins). Keys are PER-ROLE
# — a shared top-level token would feed both roles one secret. See the flat
# config.example.toml for the env-leak caveat (prefer a mode-600 file on a
# shared device).
# token_env = "GLADOS_BEDROOM_MIC_TOKEN"
# token_file = "<your-secrets-dir>/bedroom-mic.token"
# Capture backend: "sounddevice" (PortAudio, default) or "parec" (+ parec_*).
# capture_backend = "sounddevice"
# input_device = 1
# parec_rate = 48000
# parec_source = "sles_source.monitor"
# parec_args = []

[speaker]
client_id = "bedroom-speaker"
# token_env = "GLADOS_BEDROOM_SPEAKER_TOKEN"
# token_file = "<your-secrets-dir>/bedroom-speaker.token"
# Playback backend: "sounddevice" (PortAudio, default) or "pacat" (+ pacat_*,
# PulseAudio playback for Termux/Android — the mirror of "parec" capture).
# playback_backend = "sounddevice"
# output_device = 2
# prebuffer_ms = 120
# pacat_sink = "bluez_output.XX_XX_XX_XX_XX_XX.1"
# pacat_latency_msec = 80
# pacat_args = []
